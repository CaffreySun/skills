name: check

# This is the status check the `main` ruleset requires. If the job name changes,
# update the ruleset too -- see RELEASING.md.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check
